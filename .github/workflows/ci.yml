name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh --zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Clippy-${{ github.sha }}
          path: build/Clippy.zip
          retention-days: 14
