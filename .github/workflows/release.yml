name: Release

# Push a tag like v1.0.0 to build a universal Clippy.app and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME}" ./scripts/build-app.sh --zip

      - name: Verify architectures
        run: lipo -info build/Clippy.app/Contents/MacOS/clippy

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Clippy.zip \
            --title "Clippy $GITHUB_REF_NAME" \
            --generate-notes
