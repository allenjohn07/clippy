# Keeps third-party code up to date. (Security alerts are also on in the repo settings.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /Tests/E2E/browser    # Playwright, used only by the local end-to-end tests
    schedule:
      interval: monthly
